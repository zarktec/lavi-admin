name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: lavi, POSTGRES_PASSWORD: lavi, POSTGRES_DB: lavi_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lavi" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: DATABASE_URL=postgres://lavi:lavi@localhost:5432/lavi_test npm run migrate
      - run: npm test
        env: { TEST_DATABASE_URL: "postgres://lavi:lavi@localhost:5432/lavi_test" }
